
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>CareerPath | Career Explorer</title>

  <link rel="stylesheet" href="CSS/Style.Css">
  <script src="Js/app.js" defer></script>
</head>

<body>
  <header class="app-header">
    <h1>CareerPath</h1>
    <p>Explore Careers. Compare Salaries. Plan Your Future.</p>
  </header>

  <main class="container">
    <section class="intro">
      <h2>Find Your Future Career</h2>
      <p>
        Explore 20 occupations using real
        government employment and wage data.
      </p>
    </section>

    <section class="controls">
      <label for="searchInput">Search Careers</label>
      <input
        type="search"
        id="searchInput"
        placeholder="Enter a career name..."
      >

      <label for="categoryFilter">Career Category</label>
      <select id="categoryFilter">
        <option value="all">All Categories</option>
      </select>

      <label for="sortFilter">Sort Careers</label>
      <select id="sortFilter">
        <option value="default">Default Order</option>
        <option value="high">Highest Salary First</option>
        <option value="low">Lowest Salary First</option>
        <option value="az">Career Name A-Z</option>
      </select>

      <button id="resetBtn">Clear Filters</button>
    </section>

    <section class="results">
      <h2>Available Careers</h2>
      <p id="resultCount">Loading career records...</p>
      <div id="careerList" class="career-grid"></div>
    </section>
  </main>

  <footer>
    <p>CareerPath Mobile App</p>
    <p>Data Source: New York State Open Data</p>
  </footer>
</body>
</html>
